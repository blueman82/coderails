[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["assets", "dist", "fixtures", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
include = [
  "scripts/quality/check.py",
  "packages/codex/hooks/scripts/lib/quality_check.py",
  "packages/codex/skills/agentic-loop/scripts",
  "hooks/scripts/test_gate.py",
  "hooks/scripts/tests/test_gate_test.py",
  "hooks/scripts/agent_model_routing_nudge.py",
  "hooks/scripts/inject_bootstrap.py",
  "hooks/scripts/inject_context.py",
  "hooks/scripts/lib/graph_readiness.py",
]

[tool.mypy]
python_version = "3.9"
strict = true
explicit_package_bases = true
mypy_path = "hooks/scripts"
