project: my-project
wiki_path: null
# Wiki supervision mode for wiki-ingest: "discuss" (default, pauses to discuss
# before writing) or "autonomous" (curates and commits without pausing).
# Default/absent = discuss.
wiki_supervision: discuss
# Wiki git flow, read by wiki-ingest/wiki-lint/wiki-query. wiki_git_worktree:
# true = PR flow for wiki commits (default/absent = true, the fail-safe
# choice); false = write and commit directly to the vault. The other two
# only apply when wiki_git_worktree is true.
wiki_git_worktree: true
wiki_git_bypass_flag: null   # e.g. "BYPASS_REVIEW=1" — env var for the wiki's own PR create/merge
wiki_git_pull_path: null   # e.g. /path/to/source-repo — pulled after a wiki PR merges
worktree_base: null
worktree_script: null
jira: null
engineering_principles_paths: null
engineering_principles_skill: /engineering-principles-python
# When true, agentic-loop dispatches implementation-unit workers as separate
# OS-sandboxed processes (@anthropic-ai/sandbox-runtime) instead of in-process
# Agent calls — write containment outside the agent's trust domain. Requires
# node/npx and a supported platform (macOS Seatbelt, Linux/WSL2 bubblewrap).
# Default/absent = false (today's in-process dispatch, unchanged).
sandbox_workers: false
# tier_review.machine_user: the GitHub login of the dedicated machine-user
# identity that posts `tier-review` commit statuses. When set, scripts/merge.sh
# and hooks/scripts/enforce_pr_workflow.sh additionally require, for any PR
# at any tier, that the newest `tier-review` status on the head SHA be
# state=success AND posted by this exact login — a mismatch blocks
# the merge as a misconfiguration-or-forgery signal. This is a redundant local
# gate (defence-in-depth): the primary control is a server-side ruleset.
# Absent/omitted (default) = this check is inactive; other installs unaffected.
# tier_review:
#   machine_user: null
