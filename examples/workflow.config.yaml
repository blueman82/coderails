project: my-project
wiki_path: null
# Wiki supervision mode for wiki-ingest: "discuss" (default, pauses to discuss
# before writing) or "autonomous" (curates and commits without pausing).
# Default/absent = discuss.
wiki_supervision: discuss
# Wiki git flow, read by wiki-ingest/wiki-lint/wiki-query. wiki_git_worktree:
# true = PR flow for wiki commits (default/absent = true, the fail-safe
# choice); false = write and commit directly to the vault. The other two
# only apply when wiki_git_worktree is true.
wiki_git_worktree: true
wiki_git_bypass_flag: null   # e.g. "BYPASS_REVIEW=1" — env var for the wiki's own PR create/merge
wiki_git_pull_path: null   # e.g. /path/to/source-repo — pulled after a wiki PR merges
worktree_base: null
worktree_script: null
jira: null
engineering_principles_paths: null
engineering_principles_skill: /engineering-principles-python
# true or absent (default) = agentic-loop dispatches implementation-unit workers
# as separate OS-sandboxed processes (@anthropic-ai/sandbox-runtime) in a scratch
# clone with an isolated HOME and no GH_TOKEN, instead of in-process Agent calls.
# Needs node/npx, macOS Seatbelt or Linux/WSL2 bubblewrap, and the owner's
# ~/.coderails/worker_credential (mode 0600); without them it falls back to
# in-process dispatch. false = off. A cooperating-agent safeguard.
sandbox_workers: true
# action_authority: enforce (default; also when this key or the whole config is
# absent) = gh pr merge, scripts/merge.py and git push to main/master need an
# owner-signed, single-use receipt bound to repository+ref+SHA, and honour the
# session authority (denied, approval_required_for, max_prs). advisory = trace and
# warn only. off = switch the gate off. An unrecognised value is treated as enforce
# (traced action_authority_bad_mode). The owner mints receipts with
# scripts/action_receipt_cli.py approve-action.
action_authority: enforce
# integrity_review.machine_user: the GitHub login of the dedicated machine-user
# identity that posts `integrity-review` commit statuses. When set, scripts/merge.py
# and hooks/scripts/enforce_pr_workflow.py additionally require, for any PR
# that the newest `integrity-review` status on the head SHA be
# state=success AND posted by this exact login — a mismatch blocks
# the merge as a misconfiguration-or-forgery signal. This is a redundant local
# gate (defence-in-depth): the primary control is a server-side ruleset.
# Absent/omitted (default) = this check is inactive; other installs unaffected.
# integrity_review:
#   machine_user: null
# diff_manifest / diff_manifest_policy: opt-in additional check run by scripts/push.py
# (before `git push`) and scripts/merge.py (after the existing gates). The policy is a
# JSON file {allow:[glob], deny:[glob], manifest:[glob], docs_sync:{allow,deny},
# require_linked_worktree:bool}; the diff is `git diff --raw -z -M origin/<main>...<head>`.
# diff_manifest: off | advisory | enforce (default advisory = warning + trace row;
# enforce refuses with diff_manifest:<reason_code>). No policy file = the check is inactive.
# diff_manifest: advisory
# diff_manifest_policy: .coderails/diff-policy.json
