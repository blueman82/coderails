name: Integrity review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: coderails-integrity-review
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact PR head evidence
        run: python3 scripts/integrity-gate/integrity_actions.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
